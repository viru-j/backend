server:
  port: 8080
logging:
  level:
    root: INFO
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  user: ${NEO4J_USER:neo4j}
  password: ${NEO4J_PASSWORD:password}
mcp:
  base-url: http://localhost:8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    build:
      enabled: true
